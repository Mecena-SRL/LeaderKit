name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      macos_dmg:
        description: "Crea anche il .dmg compresso su runner macOS (hdiutil)"
        type: boolean
        default: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4 genisoimage
      - run: pip install pytest pyflakes pillow numpy
      - run: python -m pyflakes src tests tools
      - run: python -m pytest -q tests
      - run: python tools/build.py
      - run: python tools/build_fx.py
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: LeaderKit-dist
          path: dist/

  macos-dmg:
    if: github.event_name == 'workflow_dispatch' && inputs.macos_dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: LeaderKit-macOS-dmg
          path: dist/*.dmg
